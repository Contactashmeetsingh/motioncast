[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motioncast"
version = "0.2.0"
description = "Soccer broadcast video -> tracked players, ball, teams, minimap and match stats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "ultralytics>=8.3",
    # 0.27+ removed sv.ByteTrack (moved to the separate `trackers` package).
    "supervision>=0.25,<0.27",
    "transformers>=4.40,<5",
    "umap-learn",
    "scikit-learn",
    "pillow",
    "tqdm",
    "gdown",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
motioncast = "motioncast.cli:main"

[tool.setuptools.packages.find]
include = ["motioncast*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"motioncast/pipeline.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning:umap"]
